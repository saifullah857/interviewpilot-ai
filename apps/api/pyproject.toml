[project]
name = "interviewpilot-api"
version = "0.2.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 170
extend-exclude = ["alembic/versions"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008", "UP047"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S608", "E501"]
"app/resumes/analyst.py" = ["E501"]  # prompt text
"app/research/workflow.py" = ["E501"]  # prompt text
"app/assessments/workflow.py" = ["E501"]  # prompt text
"app/coding/service.py" = ["E501"]  # prompt text and messages
"app/interviews/*.py" = ["E501"]  # prompt text and messages
"app/reports/*.py" = ["E501"]  # prompt text and messages
"app/models/__init__.py" = ["E501"]
